# hispec_tracking_camera configuration for camerad + emulator SHM testing (CI)

DAEMON=no
IMDIR=/tmp
LOGPATH=/tmp
BASENAME=hispecshmtest
DIRMODE=0077
TM_ZONE_LOG=local
TM_ZONE=UTC
TZ_ENV=PST8PDT,M3.2.0/2,M11.1.0/2

NBPORT=3130
BLKPORT=3131
EMULATOR_PORT=3132
EMULATOR_SYSTEM=Config/hispec_shm_test/hispec_shm_test.system

ASYNCGROUP=none

ARCHON_IP=localhost
ARCHON_PORT=3132
DEFAULT_FIRMWARE=camerad/Instruments/hispec_tracking_camera/config/hispecatc.acf
EXPOSE_PARAM=Expose
ABORT_PARAM=abort
READOUT_TIME=5000
WRITE_TAPINFO_TO_FITS=no

SHM_ENABLED=yes
SHM_SEGMENT_NAME=ci_hispec_shm
SHM_RING_BUFFER_SIZE=2
SHM_DIR=/tmp/ci_milk_shm
