name: CMake workflow

on:
  push:
    branches: ["main", "camera-2.0"]
  pull_request:
    branches: ["main", "camera-2.0"]
  workflow_dispatch:
    inputs:
      target:
        description: "Optional build target or instrument name (leave blank for default build)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUILD_TYPE: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve requested target
        shell: bash
        run: |
          TARGET_NAME="${{ github.event.inputs.target }}"
          echo "TARGET_NAME=${TARGET_NAME}" >> "$GITHUB_ENV"
          if [[ -z "$TARGET_NAME" ]]; then
            echo "Default build requested"
          else
            echo "Requested target: $TARGET_NAME"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          bash .github/workflows/install-deps.sh

      - name: Build and install zmqpp from source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/zeromq/zmqpp.git /tmp/zmqpp
          cmake -S /tmp/zmqpp -B /tmp/zmqpp/build
          cmake --build /tmp/zmqpp/build -j"$(nproc)"
          sudo cmake --install /tmp/zmqpp/build
          sudo ldconfig

      - name: Rewrite GitHub SSH URLs for submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive

      - name: Update matching submodule
        if: env.TARGET_NAME != '' && env.TARGET_NAME != 'emulator'
        shell: bash
        run: |
          if [[ ! -f .gitmodules ]]; then
            echo "No .gitmodules file found; skipping submodule update."
            exit 0
          fi

          MATCH_PATH=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk -v target="$TARGET_NAME" '
            $2 == target { print $2; exit }
            $2 ~ "/" target "$" { print $2; exit }
          ')

          if [[ -z "$MATCH_PATH" ]]; then
            echo "No submodule path matched '$TARGET_NAME'; continuing without submodule update."
            exit 0
          fi

          echo "Matched submodule path: $MATCH_PATH"
          git submodule sync -- "$MATCH_PATH"
          git submodule update --init --recursive --remote -- "$MATCH_PATH"

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cd build

          CMAKE_ARGS=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
            -DCONTROLLER=archon
          )

          if [[ -n "$TARGET_NAME" && "$TARGET_NAME" != "emulator" ]]; then
            CMAKE_ARGS+=("-DINSTRUMENT=${TARGET_NAME}")
          fi

          cmake "${CMAKE_ARGS[@]}" ..

      - name: Build default
        if: env.TARGET_NAME == ''
        shell: bash
        run: |
          cmake --build build -j"$(nproc)"
          if cmake --build build --target run_unit_tests -j"$(nproc)"; then
            ./bin/run_unit_tests
          else
            echo "run_unit_tests target not available; skipping unit tests."
          fi

      - name: Build emulator target
        if: env.TARGET_NAME == 'emulator'
        shell: bash
        run: |
          cmake --build build --target emulator -j"$(nproc)"

      - name: Build named target
        if: env.TARGET_NAME != '' && env.TARGET_NAME != 'emulator'
        shell: bash
        run: |
          cmake --build build -j"$(nproc)"

  cmake-3-24-subproject:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CMAKE_324: cmake-3.24.4-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          bash .github/workflows/install-deps.sh

      - name: Build and install zmqpp from source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/zeromq/zmqpp.git /tmp/zmqpp
          cmake -S /tmp/zmqpp -B /tmp/zmqpp/build
          cmake --build /tmp/zmqpp/build -j"$(nproc)"
          sudo cmake --install /tmp/zmqpp/build
          sudo ldconfig

      # The declared minimum is only true if something builds with it
      - name: Install CMake 3.24.4
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLO "https://github.com/Kitware/CMake/releases/download/v3.24.4/${CMAKE_324}.tar.gz"
          echo "cac77d28fb8668c179ac02c283b058aeb846fe2133a57d40b503711281ed9f19  ${CMAKE_324}.tar.gz" | sha256sum -c
          tar xzf "${CMAKE_324}.tar.gz"
          echo "$RUNNER_TEMP/${CMAKE_324}/bin" >> "$GITHUB_PATH"

      - name: Build the core as a top-level project
        shell: bash
        run: |
          cmake --version
          cmake -G Ninja -S . -B build -DCONTROLLER=archon
          cmake --build build -j"$(nproc)"

      # Stands in for an instrument's build: the core composed as a subproject,
      # and a translation unit of the consumer's own that includes its headers
      - name: Build the core as a subproject
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(consumer CXX)
          # Below the core's C++17, so the core has to raise it for its headers
          set(CMAKE_CXX_STANDARD 14)
          set(CONTROLLER archon CACHE STRING "")
          include(FetchContent)
          FetchContent_Declare(camerad SOURCE_DIR ${CAMERAD_SOURCE_DIR})
          FetchContent_MakeAvailable(camerad)
          add_library(consumer OBJECT consumer.cpp)
          target_link_libraries(consumer PRIVATE camerad_base)
          EOF
          cat > consumer.cpp <<'EOF'
          #include "camera_interface.h"
          EOF
          cmake -G Ninja -S . -B build -DCAMERAD_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build -j"$(nproc)"
